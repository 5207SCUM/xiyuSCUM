<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCUM远程监控</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f5f6f8; color:#222; padding-bottom:20px; }
.header { background:#fff; padding:16px 16px 12px; border-bottom:1px solid #e8e8e8; text-align:center; }
.header h1 { font-size:20px; font-weight:700; }
.header .sub { font-size:12px; color:#888; margin-top:4px; }
.card { background:#fff; margin:12px; border-radius:12px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.label { font-size:13px; color:#666; margin:8px 0 6px; }
.row { display:flex; gap:8px; align-items:center; }
input[type=text], input[type=password] { flex:1; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:15px; outline:none; background:#fff; color:#222; }
input[type=text]:focus, input[type=password]:focus { border-color:#4A90D9; }
.btn { border:none; border-radius:8px; padding:12px 16px; font-size:15px; cursor:pointer; color:#fff; }
.btn-primary { background:#4A90D9; width:100%; }
.btn-danger { background:#e74c3c; }
.btn-warn { background:#f39c12; }
.btn:disabled { opacity:.5; }
.status-bar { display:flex; align-items:center; gap:8px; font-size:14px; margin-top:12px; }
.dot { width:10px; height:10px; border-radius:50%; background:#bbb; }
.dot.on { background:#2ecc71; }
.dot.off { background:#e74c3c; }
.log-box { background:#1a1a1a; border-radius:8px; height:320px; overflow-y:auto; padding:10px; font-family:Consolas,Monaco,monospace; font-size:12px; }
.log-line { color:#d4d4d4; padding:2px 0; border-bottom:1px solid #2a2a2a; word-break:break-all; }
.log-line .t { color:#888; margin-right:6px; }
.log-info { color:#d4d4d4; }
.log-warn { color:#f39c12; }
.log-error { color:#e74c3c; }
.btn-group { display:flex; gap:8px; }
.btn-group .btn { flex:1; padding:14px; font-size:16px; }
.status-grid { display:flex; gap:8px; margin:8px 0; }
.st-item { flex:1; background:#f5f6f8; border-radius:8px; padding:10px; text-align:center; }
.st-name { font-size:12px; color:#888; display:block; }
.st-val { font-size:20px; font-weight:700; color:#222; display:block; margin-top:4px; }
.toast { position: fixed; top: 20%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.75); color: #fff; padding: 14px 24px; border-radius: 8px; font-size: 15px; z-index: 9999; opacity: 0; transition: opacity 0.8s ease; pointer-events: none; }
.toast.show { opacity: 1; }
.footer { text-align:center; font-size:11px; color:#aaa; margin-top:10px; }
.tip { font-size:12px; color:#999; margin-top:6px; text-align:center; }
.error-text { color:#e74c3c; font-size:13px; text-align:center; margin-top:8px; min-height:18px; }
.hidden { display:none; }
/* 记住密码/记住设备复选框行 */
.check-row { text-align:center; margin:10px auto 0; }
.check-row label { font-size:13px; color:#555; margin:0 12px; cursor:pointer; display:inline-block; }
.check-row input { vertical-align:middle; margin-right:4px; }
/* 账户菜单 */
.menu-item { display:block; width:100%; padding:10px 14px; border:none; background:none; text-align:left; font-size:14px; cursor:pointer; color:#222; }
.menu-item:hover { background:#f0f4f8; }
.menu-item.danger { color:#e74c3c; }
/* 遮罩 + 弹窗 */
.overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.4); z-index:90; }
.modal { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; border-radius:12px; padding:20px; z-index:100; width:300px; }
.modal h3 { font-size:16px; margin-bottom:12px; text-align:center; }
.modal .field { margin-bottom:10px; }
.modal .field input { width:100%; }
.modal-err { color:#e74c3c; font-size:12px; min-height:16px; text-align:center; margin-top:6px; }
.modal-btn-group { display:flex; gap:8px; margin-top:12px; }
.modal-btn-group .btn { flex:1; }
/* 电脑端登录框布局：输入框为满宽八分之一并居中，按钮十分之一居中 */
#loginView .label { text-align:center; }
#loginView input[type=text], #loginView input[type=password] {
  display:block; width:12.5%; margin:0 auto; text-align:left;
}
#loginView #loginBtn {
  display:block; width:10%; margin:10px auto 0; padding:8px 6px;
  font-size:14px; white-space:nowrap;
}
/* ===== 手机端独立UI（≤768px 视为移动设备）===== */
@media (max-width: 768px) {
  #loginView input[type=text], #loginView input[type=password] {
    width:100%; /* 手机端输入框满宽 */
  }
  #loginView #loginBtn {
    width:20%; /* 手机端登录按钮为电脑端10%的两倍宽 */
  }
}
</style>
</head>
<body>

<div class="header">
  <h1>SCUM远程监控</h1>
  <div class="sub">账户登录 · 实时日志 · 远程控制</div>
</div>

<!-- ===== 登录视图 ===== -->
<div id="loginView">
  <div class="card">
    <div class="label">用户ID</div>
    <input type="text" id="loginId" placeholder="输入已注册的账户ID">
    <div class="label">密码</div>
    <input type="password" id="loginPwd" placeholder="输入账户密码">
    <div class="check-row">
      <label><input type="checkbox" id="rememberPwd"> 记住密码</label>
      <label><input type="checkbox" id="rememberDevice"> 记住设备</label>
    </div>
    <div class="error-text" id="loginError"></div>
    <button class="btn btn-primary" id="loginBtn" style="margin-top:10px;">登录</button>
    <div class="tip">使用脚本"账户"页面注册的ID和密码登录</div>
  </div>
</div>

<!-- ===== 监控视图（登录后）===== -->
<div id="monitorView" class="hidden">
  <div class="card">
    <div class="status-bar">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">连接中...</span>
      <span style="flex:1"></span>
      <button class="btn btn-danger" id="logoutBtn" style="padding:6px 10px; font-size:12px;">退出登录</button>
    </div>
  </div>

  <div class="card">
    <div class="label">运行日志</div>
    <div style="color:#e74c3c; font-size:12px; text-align:right; margin-bottom:4px;">日志最多保留100条</div>
    <div class="log-box" id="logBox">
      <div class="log-line log-info"><span class="t">--</span>等待日志推送...</div>
    </div>
  </div>

  <div class="card">
    <div class="label">人物状态</div>
    <div class="status-grid">
      <div class="st-item"><span class="st-name">生命值</span><span class="st-val" id="stHealth">--</span></div>
      <div class="st-item"><span class="st-name">能量值</span><span class="st-val" id="stEnergy">--</span></div>
      <div class="st-item"><span class="st-name">口渴值</span><span class="st-val" id="stThirst">--</span></div>
    </div>
    <div class="btn-group">
      <button class="btn btn-warn" id="reconnectBtn">重连</button>
      <button class="btn btn-primary" id="refreshStatusBtn">刷新</button>
    </div>
  </div>

  <div class="card">
    <div class="label">远程控制</div>
    <div class="btn-group">
      <button class="btn btn-danger" id="stopBtn">停止脚本</button>
      <button class="btn btn-warn" id="exitBtn">退出游戏</button>
    </div>
  </div>
</div>

<div class="footer">SCUM远程监控 · 数据经MQTT公网中转，无需内网穿透</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
(function(){
  var client = null;
  var loggedIn = false;
  var currentId = '';
  var currentTag = '';
  var LOG_TOPIC = '';
  var CMD_TOPIC = '';
  var HISTORY_TOPIC = '';
  var STATUS_TOPIC = '';  // 人物状态主题
  var historyLoaded = false;  // 是否已加载历史快照
  var ACCOUNT_TOPIC = '';

  var loginView = document.getElementById('loginView');
  var monitorView = document.getElementById('monitorView');
  var loginError = document.getElementById('loginError');
  var loginBtn = document.getElementById('loginBtn');
  var statusDot = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');
  var logBox = document.getElementById('logBox');

  // ===== 工具函数 =====
  async function sha256(text) {
    var data = new TextEncoder().encode(text);
    var hash = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hash)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }

  function setStatus(text, state){
    statusText.textContent = text;
    statusDot.className = 'dot ' + state;
  }

  var lastLogKey = null;  // 连续相同日志去重：只显示第一个，直到出现不同日志
  function addLog(level, msg, time){
    // 连续相同日志去重：与最后一条相同则跳过
    var key = (level||'') + '|' + (msg||'');
    if(key === lastLogKey) return;
    lastLogKey = key;
    var div = document.createElement('div');
    div.className = 'log-line log-' + level;
    var t = time || new Date().toLocaleTimeString('zh-CN', {hour12:false});
    div.innerHTML = '<span class="t">' + t + '</span>' + escapeHtml(msg);
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
    while(logBox.children.length > 200){
      logBox.removeChild(logBox.firstChild);
    }
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function clearLogBox(){
    lastLogKey = null;
    logBox.innerHTML = '<div class="log-line log-info"><span class="t">--</span>等待日志推送...</div>';
  }

  // ===== 登录 =====
  document.getElementById('loginBtn').onclick = function(){
    var id = document.getElementById('loginId').value.trim();
    var pwd = document.getElementById('loginPwd').value;
    if(!id || !pwd){
      loginError.textContent = '请输入用户ID和密码';
      return;
    }
    loginBtn.disabled = true;
    loginError.textContent = '正在登录验证，请稍候...';
    loginError.style.color = '#f39c12';
    doLogin(id, pwd);
  };

  function doLogin(id, pwd){
    // 先断开旧连接
    if(client){ try{ client.end(true); }catch(e){} client = null; }
    currentId = id;
    ACCOUNT_TOPIC = 'scum/accounts/' + id + '/registration';

    client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: 'web_' + Math.random().toString(36).substr(2,8),
      clean: true,
      connectTimeout: 10000,
      reconnectPeriod: 4000
    });

    var verified = false;
    var noAccountTimer = null;

    client.on('connect', function(){
      // 订阅账户注册表，读取账号信息
      client.subscribe(ACCOUNT_TOPIC, {qos:0});
      // 已验证过（断线重连成功）恢复已登录状态
      if(verified && loggedIn){
        setStatus('已登录 · ' + id, 'on');
      }
      // 连接成功但未收到账号保留消息，6秒后判定"未注册"
      if(!verified){
        noAccountTimer = setTimeout(function(){
          if(!verified){
            loginError.textContent = '该账号未注册';
            loginError.style.color = '#e74c3c';
            loginBtn.disabled = false;
            // 自动登录模式切回登录页提示
            if(monitorView && !monitorView.classList.contains('hidden')){
              monitorView.classList.add('hidden');
              loginView.classList.remove('hidden');
            }
            try{ client.end(true); }catch(e){}
          }
        }, 6000);
      }
    });

    client.on('message', function(topic, message){
      if(topic === ACCOUNT_TOPIC){
        if(noAccountTimer) clearTimeout(noAccountTimer);
        var payload = message.toString();
        if(!payload){
          // 无保留消息 = 账号未注册
          if(!verified){
            loginError.textContent = '该账号未注册';
            loginError.style.color = '#e74c3c';
            loginBtn.disabled = false;
            // 自动登录模式切回登录页提示
            if(monitorView && !monitorView.classList.contains('hidden')){
              monitorView.classList.add('hidden');
              loginView.classList.remove('hidden');
            }
            try{ client.end(true); }catch(e){}
          }
          return;
        }
        // 解析并验证
        sha256(pwd).then(function(pwHash){
          var data = null;
          try{ data = JSON.parse(payload); }catch(e){}
          if(!data || data.pw_hash !== pwHash){
            if(!verified){
              loginError.textContent = '密码错误';
              loginError.style.color = '#e74c3c';
              loginBtn.disabled = false;
              // 自动登录模式切回登录页提示
              if(monitorView && !monitorView.classList.contains('hidden')){
                monitorView.classList.add('hidden');
                loginView.classList.remove('hidden');
              }
              try{ client.end(true); }catch(e){}
            }
            return;
          }
          // 验证通过
          verified = true;
          loginSuccess(id, pwd);
        });
      } else if(topic === HISTORY_TOPIC){
        // 历史日志快照（retained 数组，最多100条）
        try{
          var arr = JSON.parse(message.toString());
          if(Array.isArray(arr)){
            if(arr.length === 0){
              // 脚本启动清空：同步清空网页端日志，之后仅接收实时新日志
              clearLogBox();
              historyLoaded = true;
            } else if(!historyLoaded){
              // 首次登录/刷新：加载历史快照
              clearLogBox();
              arr.forEach(function(item){
                var lv = (item.level||'info').toLowerCase();
                if(!['info','warn','error'].includes(lv)) lv='info';
                addLog(lv, item.msg||'', item.time||'');
              });
              historyLoaded = true;
            }
            // 运行中的非空快照忽略（实时日志已覆盖，避免重复）
          }
        }catch(e){}
      } else if(topic === LOG_TOPIC){
        // 日志消息
        var text = message.toString();
        try{
          var d = JSON.parse(text);
          var level = (d.level||'info').toLowerCase();
          if(!['info','warn','error'].includes(level)) level='info';
          addLog(level, d.msg||text, d.time||'');
        }catch(e){
          addLog('info', text);
        }
      } else if(topic === STATUS_TOPIC){
        // 人物状态
        try{
          var st = JSON.parse(message.toString());
          var sh = document.getElementById('stHealth');
          var se = document.getElementById('stEnergy');
          var stt = document.getElementById('stThirst');
          if(sh) sh.textContent = (st.health == null) ? '--' : st.health + '%';
          if(se) se.textContent = (st.energy == null) ? '--' : st.energy + '%';
          if(stt) stt.textContent = (st.thirst == null) ? '--' : st.thirst + '%';
          // 刷新请求的反馈
          if(refreshPending){
            refreshPending = false;
            if(refreshTimer){ clearTimeout(refreshTimer); refreshTimer = null; }
            if(st.health == null && st.energy == null && st.thirst == null){
              addLog('warn', '未接收到状态，游戏可能离线或打开背包，请30s后再刷新或点击重连');
            }
          }
        }catch(e){}
      }
    });

    client.on('close', function(){
      if(loggedIn){
        setStatus('连接断开，重连中...', 'off');
      } else if(monitorView && !monitorView.classList.contains('hidden')){
        setStatus('重连中...', 'off');
      }
    });

    client.on('error', function(){
      if(!verified && !loggedIn){
        // 自动登录模式：保持监控页"重连中"，等待网络恢复自动重连
        if(monitorView && !monitorView.classList.contains('hidden')){
          setStatus('重连中...', 'off');
          return;
        }
        loginError.textContent = '连接失败，请检查网络';
        loginError.style.color = '#e74c3c';
        loginBtn.disabled = false;
      }
    });
  }

  function loginSuccess(id, pwd){
    // 保存记住密码/记住设备状态
    if(document.getElementById('rememberPwd').checked){
      localStorage.setItem('scum_rp', JSON.stringify({id:id, pwd:pwd}));
    } else {
      localStorage.removeItem('scum_rp');
    }
    if(document.getElementById('rememberDevice').checked){
      localStorage.setItem('scum_rd', JSON.stringify({id:id, pwd:pwd}));
    } else {
      localStorage.removeItem('scum_rd');
    }
    // 计算tag并订阅日志主题
    sha256(pwd).then(function(pwHash){
      currentTag = pwHash.substring(0, 10);
      LOG_TOPIC = 'scum/' + id + '/' + currentTag + '/log';
      CMD_TOPIC = 'scum/' + id + '/' + currentTag + '/cmd';
      HISTORY_TOPIC = 'scum/' + id + '/' + currentTag + '/history';
      STATUS_TOPIC = 'scum/' + id + '/' + currentTag + '/status';
      client.subscribe(LOG_TOPIC, {qos:0});
      client.subscribe(HISTORY_TOPIC, {qos:0});
      client.subscribe(STATUS_TOPIC, {qos:0});
      loggedIn = true;
      historyLoaded = false;
      // 切换到监控视图
      loginView.classList.add('hidden');
      monitorView.classList.remove('hidden');
      setStatus('已登录 · ' + id, 'on');
      addLog('info', '登录成功，开始接收日志');
      // 显示账户信息
    });
  }

  // ===== 页面加载：填充记住的账号密码 + 自动登录（记住设备）=====
  function initLogin(){
    try{
      var rp = JSON.parse(localStorage.getItem('scum_rp')||'null');
      if(rp && rp.id){
        document.getElementById('loginId').value = rp.id;
        if(rp.pwd) document.getElementById('loginPwd').value = rp.pwd;
        document.getElementById('rememberPwd').checked = true;
      }
    }catch(e){}
    try{
      var rd = JSON.parse(localStorage.getItem('scum_rd')||'null');
      if(rd && rd.id && rd.pwd){
        document.getElementById('rememberDevice').checked = true;
        // 记住设备自动登录：不弹出登录页面，直接进入监控页提示重连中，直到连接成功登录
        loginView.classList.add('hidden');
        monitorView.classList.remove('hidden');
        setStatus('重连中...', 'off');
        doLogin(rd.id, rd.pwd);
      }
    }catch(e){}
  }
  initLogin();

  // ===== 账号输入框变动时，若与记住的账号不一致则清除密码 =====
  document.getElementById('loginId').addEventListener('input', function(){
    var rp = null;
    try{ rp = JSON.parse(localStorage.getItem('scum_rp')||'null'); }catch(e){}
    if(rp && rp.id && this.value.trim() !== rp.id){
      document.getElementById('loginPwd').value = '';
    }
  });

  // ===== 控制指令 =====
  function publishCmd(cmd){
    if(!loggedIn || !client) return;
    client.publish(CMD_TOPIC, JSON.stringify({cmd: cmd}), {qos:0});
    addLog('info', '已发送指令: ' + cmd);
  }
  document.getElementById('stopBtn').onclick = function(){ publishCmd('stop'); };
  document.getElementById('exitBtn').onclick = function(){ publishCmd('exit'); };
  var refreshTimer = null;
  var refreshPending = false;
  var lastRefreshTime = 0;
  function showToast(msg){
    var t = document.getElementById('toastMsg');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    clearTimeout(t._tm2);
    t._tm2 = setTimeout(function(){ t.classList.remove('show'); }, 3000);
  }
  function onRefreshClick(){
    var now = Date.now();
    if(now - lastRefreshTime < 30000){
      showToast('频繁操作，请稍后再试');
      return;
    }
    lastRefreshTime = now;
    publishCmd('refresh_status');
    refreshPending = true;
    addLog('info', '已刷新');
    if(refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = setTimeout(function(){
      refreshTimer = null;
      refreshPending = false;
      addLog('warn', '脚本可能掉线，请检查脚本登录状态再尝试');
    }, 10000);
  }
  document.getElementById('refreshStatusBtn').onclick = onRefreshClick;
  document.getElementById('reconnectBtn').onclick = function(){ publishCmd('reconnect'); };

  // ===== 退出登录 =====
  function doLogout(){
    try{ client.end(true); }catch(e){}
    client = null; loggedIn = false;
    monitorView.classList.add('hidden');
    loginView.classList.remove('hidden');
    loginError.textContent = '';
    // 记住密码则保留账号密码（保持在输入框）；否则清空密码
    var rp = null;
    try{ rp = JSON.parse(localStorage.getItem('scum_rp')||'null'); }catch(e){}
    if(rp && rp.id && document.getElementById('loginId').value.trim() === rp.id && rp.pwd){
      document.getElementById('loginPwd').value = rp.pwd;
      document.getElementById('rememberPwd').checked = true;
    } else {
      document.getElementById('loginPwd').value = '';
    }
    // 记住设备则保持自动登录勾选
    var rd = null;
    try{ rd = JSON.parse(localStorage.getItem('scum_rd')||'null'); }catch(e){}
    document.getElementById('rememberDevice').checked = !!(rd && rd.id);
    loginBtn.disabled = false;
    logBox.innerHTML = '<div class="log-line log-info"><span class="t">--</span>等待日志推送...</div>';
  }
  document.getElementById('logoutBtn').onclick = doLogout;

})();
</script>
  <div class="toast" id="toastMsg"></div>
</body>
</html>
