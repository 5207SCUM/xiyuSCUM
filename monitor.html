<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCUM远程监控</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f5f6f8; color:#222; padding-bottom:20px; }
.header { background:#fff; padding:16px 16px 12px; border-bottom:1px solid #e8e8e8; text-align:center; }
.header h1 { font-size:20px; font-weight:700; }
.header .sub { font-size:12px; color:#888; margin-top:4px; }
.card { background:#fff; margin:12px; border-radius:12px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.label { font-size:13px; color:#666; margin-bottom:6px; }
.row { display:flex; gap:8px; align-items:center; }
input[type=text] { flex:1; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:15px; outline:none; }
input[type=text]:focus { border-color:#4A90D9; }
.btn { border:none; border-radius:8px; padding:10px 16px; font-size:15px; cursor:pointer; color:#fff; }
.btn-primary { background:#4A90D9; }
.btn-danger { background:#e74c3c; }
.btn-warn { background:#f39c12; }
.btn:disabled { opacity:.5; }
.status-bar { display:flex; align-items:center; gap:8px; font-size:14px; margin-top:8px; }
.dot { width:10px; height:10px; border-radius:50%; background:#bbb; }
.dot.on { background:#2ecc71; }
.dot.off { background:#e74c3c; }
.log-box { background:#1a1a1a; border-radius:8px; height:320px; overflow-y:auto; padding:10px; font-family:Consolas,Monaco,monospace; font-size:12px; }
.log-line { color:#d4d4d4; padding:2px 0; border-bottom:1px solid #2a2a2a; word-break:break-all; }
.log-line .t { color:#888; margin-right:6px; }
.log-info { color:#d4d4d4; }
.log-warn { color:#f39c12; }
.log-error { color:#e74c3c; }
.btn-group { display:flex; gap:8px; }
.btn-group .btn { flex:1; padding:14px; font-size:16px; }
.footer { text-align:center; font-size:11px; color:#aaa; margin-top:10px; }
</style>
</head>
<body>

<div class="header">
  <h1>SCUM远程监控</h1>
  <div class="sub">实时查看运行日志 · 远程控制</div>
</div>

<!-- 连接配置 -->
<div class="card">
  <div class="label">用户ID（脚本运行窗口显示的ID）</div>
  <div class="row">
    <input type="text" id="clientId" placeholder="如：小雨_4821">
    <button class="btn btn-primary" id="connectBtn">连接</button>
  </div>
  <div class="status-bar">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">未连接</span>
  </div>
</div>

<!-- 日志 -->
<div class="card">
  <div class="label">运行日志</div>
  <div class="log-box" id="logBox">
    <div class="log-line log-info"><span class="t">--</span>等待连接，请输入用户ID后点击"连接"</div>
  </div>
</div>

<!-- 控制 -->
<div class="card">
  <div class="label">远程控制</div>
  <div class="btn-group">
    <button class="btn btn-danger" id="stopBtn" disabled>停止脚本</button>
    <button class="btn btn-warn" id="exitBtn" disabled>退出游戏</button>
  </div>
</div>

<div class="footer">SCUM远程监控 · 数据经MQTT公网中转，无需内网穿透</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
(function(){
  var client = null;
  var connected = false;
  var clientId = '';

  var statusDot = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');
  var logBox = document.getElementById('logBox');
  var stopBtn = document.getElementById('stopBtn');
  var exitBtn = document.getElementById('exitBtn');

  function setStatus(text, state){
    statusText.textContent = text;
    statusDot.className = 'dot ' + state;
  }

  function addLog(level, msg, time){
    var div = document.createElement('div');
    div.className = 'log-line log-' + level;
    var t = time || new Date().toLocaleTimeString('zh-CN', {hour12:false});
    div.innerHTML = '<span class="t">' + t + '</span>' + escapeHtml(msg);
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
    // 限制日志条数
    while(logBox.children.length > 200){
      logBox.removeChild(logBox.firstChild);
    }
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function publishCmd(cmd){
    if(!connected || !clientId) return;
    var topic = 'scum/' + clientId + '/cmd';
    var payload = JSON.stringify({cmd: cmd});
    client.publish(topic, payload, {qos:0});
    addLog('info', '已发送指令: ' + cmd + ' (→' + topic + ')');
  }

  document.getElementById('connectBtn').onclick = function(){
    if(connected){
      // 断开
      try{ client.end(true); }catch(e){}
      client = null; connected = false;
      setStatus('未连接','');
      stopBtn.disabled = true; exitBtn.disabled = true;
      document.getElementById('connectBtn').textContent = '连接';
      addLog('info','已断开连接');
      return;
    }
    clientId = document.getElementById('clientId').value.trim();
    if(!clientId){
      alert('请输入用户ID');
      return;
    }
    var broker = 'wss://broker.emqx.io:8084/mqtt'; // WebSocket加密端口
    setStatus('连接中...','');
    try{
      client = mqtt.connect(broker, {
        clientId: 'web_' + Math.random().toString(36).substr(2,8),
        clean: true,
        connectTimeout: 10000,
        reconnectPeriod: 4000
      });

      client.on('connect', function(){
        connected = true;
        setStatus('已连接 · ' + clientId, 'on');
        stopBtn.disabled = false; exitBtn.disabled = false;
        document.getElementById('connectBtn').textContent = '断开';
        // 订阅日志主题
        var logTopic = 'scum/' + clientId + '/log';
        client.subscribe(logTopic, {qos:0});
        var statusTopic = 'scum/' + clientId + '/status';
        client.subscribe(statusTopic, {qos:0});
        addLog('info','已连接，订阅主题: ' + logTopic);
      });

      client.on('message', function(topic, message){
        var text = message.toString();
        try{
          var data = JSON.parse(text);
          var level = (data.level||'info').toLowerCase();
          if(!['info','warn','error'].includes(level)) level='info';
          addLog(level, data.msg||text, data.time||'');
        }catch(e){
          addLog('info', text);
        }
      });

      client.on('close', function(){
        if(connected){
          connected = false;
          setStatus('已断开，重连中...','off');
          stopBtn.disabled = true; exitBtn.disabled = true;
          addLog('warn','连接已断开，正在自动重连');
        }
      });

      client.on('error', function(err){
        addLog('error','连接错误: ' + err.message);
        setStatus('连接失败','off');
      });
    }catch(e){
      addLog('error','创建连接失败: ' + e.message);
      setStatus('连接失败','off');
    }
  };

  stopBtn.onclick = function(){ publishCmd('stop'); };
  exitBtn.onclick = function(){ publishCmd('exit'); };

})();
</script>
</body>
</html>
