<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCUM远程监控</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f5f6f8; color:#222; padding-bottom:20px; }
.header { background:#fff; padding:16px 16px 12px; border-bottom:1px solid #e8e8e8; text-align:center; }
.header h1 { font-size:20px; font-weight:700; }
.header .sub { font-size:12px; color:#888; margin-top:4px; }
.card { background:#fff; margin:12px; border-radius:12px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.label { font-size:13px; color:#666; margin:8px 0 6px; }
.row { display:flex; gap:8px; align-items:center; }
input[type=text], input[type=password] { flex:1; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:15px; outline:none; background:#fff; color:#222; }
input[type=text]:focus, input[type=password]:focus { border-color:#4A90D9; }
.btn { border:none; border-radius:8px; padding:12px 16px; font-size:15px; cursor:pointer; color:#fff; }
.btn-primary { background:#4A90D9; width:100%; }
.btn-danger { background:#e74c3c; }
.btn-warn { background:#f39c12; }
.btn:disabled { opacity:.5; }
.status-bar { display:flex; align-items:center; gap:8px; font-size:14px; margin-top:12px; }
.dot { width:10px; height:10px; border-radius:50%; background:#bbb; }
.dot.on { background:#2ecc71; }
.dot.off { background:#e74c3c; }
.log-box { background:#1a1a1a; border-radius:8px; height:320px; overflow-y:auto; padding:10px; font-family:Consolas,Monaco,monospace; font-size:12px; }
.log-line { color:#d4d4d4; padding:2px 0; border-bottom:1px solid #2a2a2a; word-break:break-all; }
.log-line .t { color:#888; margin-right:6px; }
.log-info { color:#d4d4d4; }
.log-warn { color:#f39c12; }
.log-error { color:#e74c3c; }
.btn-group { display:flex; gap:8px; }
.btn-group .btn { flex:1; padding:14px; font-size:16px; }
.footer { text-align:center; font-size:11px; color:#aaa; margin-top:10px; }
.tip { font-size:12px; color:#999; margin-top:6px; text-align:center; }
.error-text { color:#e74c3c; font-size:13px; text-align:center; margin-top:8px; min-height:18px; }
.hidden { display:none; }
/* 登录框布局：输入框为满宽八分之一并居中，按钮十分之一居中 */
#loginView .label { text-align:center; }
#loginView input[type=text], #loginView input[type=password] {
  display:block; width:12.5%; margin:0 auto; text-align:left;
}
#loginView #loginBtn {
  display:block; width:10%; margin:10px auto 0; padding:8px 6px;
  font-size:14px; white-space:nowrap;
}
</style>
</head>
<body>

<div class="header">
  <h1>SCUM远程监控</h1>
  <div class="sub">账户登录 · 实时日志 · 远程控制</div>
</div>

<!-- ===== 登录视图 ===== -->
<div id="loginView">
  <div class="card">
    <div class="label">用户ID</div>
    <input type="text" id="loginId" placeholder="输入已注册的账户ID">
    <div class="label">密码</div>
    <input type="password" id="loginPwd" placeholder="输入账户密码">
    <div class="error-text" id="loginError"></div>
    <button class="btn btn-primary" id="loginBtn" style="margin-top:10px;">登录</button>
    <div class="tip">使用脚本"账户"页面注册的ID和密码登录</div>
  </div>
</div>

<!-- ===== 监控视图（登录后）===== -->
<div id="monitorView" class="hidden">
  <div class="card">
    <div class="status-bar">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">连接中...</span>
      <span style="flex:1"></span>
      <button class="btn btn-danger" id="logoutBtn" style="padding:6px 10px; font-size:12px;">退出登录</button>
    </div>
  </div>

  <div class="card">
    <div class="label">运行日志</div>
    <div class="log-box" id="logBox">
      <div class="log-line log-info"><span class="t">--</span>等待日志推送...</div>
    </div>
  </div>

  <div class="card">
    <div class="label">远程控制</div>
    <div class="btn-group">
      <button class="btn btn-danger" id="stopBtn">停止脚本</button>
      <button class="btn btn-warn" id="exitBtn">退出游戏</button>
    </div>
  </div>
</div>

<div class="footer">SCUM远程监控 · 数据经MQTT公网中转，无需内网穿透</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
(function(){
  var client = null;
  var loggedIn = false;
  var currentId = '';
  var currentTag = '';
  var LOG_TOPIC = '';
  var CMD_TOPIC = '';
  var ACCOUNT_TOPIC = '';

  var loginView = document.getElementById('loginView');
  var monitorView = document.getElementById('monitorView');
  var loginError = document.getElementById('loginError');
  var loginBtn = document.getElementById('loginBtn');
  var statusDot = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');
  var logBox = document.getElementById('logBox');

  // ===== 工具函数 =====
  async function sha256(text) {
    var data = new TextEncoder().encode(text);
    var hash = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hash)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }

  function setStatus(text, state){
    statusText.textContent = text;
    statusDot.className = 'dot ' + state;
  }

  function addLog(level, msg, time){
    var div = document.createElement('div');
    div.className = 'log-line log-' + level;
    var t = time || new Date().toLocaleTimeString('zh-CN', {hour12:false});
    div.innerHTML = '<span class="t">' + t + '</span>' + escapeHtml(msg);
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
    while(logBox.children.length > 200){
      logBox.removeChild(logBox.firstChild);
    }
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ===== 登录 =====
  document.getElementById('loginBtn').onclick = function(){
    var id = document.getElementById('loginId').value.trim();
    var pwd = document.getElementById('loginPwd').value;
    if(!id || !pwd){
      loginError.textContent = '请输入用户ID和密码';
      return;
    }
    loginBtn.disabled = true;
    loginError.textContent = '正在登录验证，请稍候...';
    loginError.style.color = '#f39c12';
    doLogin(id, pwd);
  };

  function doLogin(id, pwd){
    // 先断开旧连接
    if(client){ try{ client.end(true); }catch(e){} client = null; }
    currentId = id;
    ACCOUNT_TOPIC = 'scum/accounts/' + id + '/registration';

    client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: 'web_' + Math.random().toString(36).substr(2,8),
      clean: true,
      connectTimeout: 10000,
      reconnectPeriod: 4000
    });

    var verified = false;
    var noAccountTimer = null;

    client.on('connect', function(){
      // 订阅账户注册表，读取账号信息
      client.subscribe(ACCOUNT_TOPIC, {qos:0});
      // 连接成功但未收到账号保留消息，6秒后判定"未注册"
      if(!verified){
        noAccountTimer = setTimeout(function(){
          if(!verified){
            loginError.textContent = '该账号未注册';
            loginError.style.color = '#e74c3c';
            loginBtn.disabled = false;
            try{ client.end(true); }catch(e){}
          }
        }, 6000);
      }
    });

    client.on('message', function(topic, message){
      if(topic === ACCOUNT_TOPIC){
        if(noAccountTimer) clearTimeout(noAccountTimer);
        var payload = message.toString();
        if(!payload){
          // 无保留消息 = 账号未注册
          if(!verified){
            loginError.textContent = '该账号未注册';
            loginError.style.color = '#e74c3c';
            loginBtn.disabled = false;
            try{ client.end(true); }catch(e){}
          }
          return;
        }
        // 解析并验证
        sha256(pwd).then(function(pwHash){
          var data = null;
          try{ data = JSON.parse(payload); }catch(e){}
          if(!data || data.pw_hash !== pwHash){
            if(!verified){
              loginError.textContent = '密码错误';
              loginError.style.color = '#e74c3c';
              loginBtn.disabled = false;
              try{ client.end(true); }catch(e){}
            }
            return;
          }
          // 验证通过
          verified = true;
          loginSuccess(id, pwd);
        });
      } else if(topic === LOG_TOPIC){
        // 日志消息
        var text = message.toString();
        try{
          var d = JSON.parse(text);
          var level = (d.level||'info').toLowerCase();
          if(!['info','warn','error'].includes(level)) level='info';
          addLog(level, d.msg||text, d.time||'');
        }catch(e){
          addLog('info', text);
        }
      }
    });

    client.on('close', function(){
      if(loggedIn){
        setStatus('连接断开，重连中...', 'off');
      }
    });

    client.on('error', function(){
      if(!verified && !loggedIn){
        loginError.textContent = '连接失败，请检查网络';
        loginError.style.color = '#e74c3c';
        loginBtn.disabled = false;
      }
    });
  }

  function loginSuccess(id, pwd){
    // 计算tag并订阅日志主题
    sha256(pwd).then(function(pwHash){
      currentTag = pwHash.substring(0, 10);
      LOG_TOPIC = 'scum/' + id + '/' + currentTag + '/log';
      CMD_TOPIC = 'scum/' + id + '/' + currentTag + '/cmd';
      client.subscribe(LOG_TOPIC, {qos:0});
      loggedIn = true;
      // 切换到监控视图
      loginView.classList.add('hidden');
      monitorView.classList.remove('hidden');
      setStatus('已登录 · ' + id, 'on');
      addLog('info', '登录成功，开始接收日志');
      // 显示账户信息
    });
  }

  // ===== 控制指令 =====
  function publishCmd(cmd){
    if(!loggedIn || !client) return;
    client.publish(CMD_TOPIC, JSON.stringify({cmd: cmd}), {qos:0});
    addLog('info', '已发送指令: ' + cmd);
  }
  document.getElementById('stopBtn').onclick = function(){ publishCmd('stop'); };
  document.getElementById('exitBtn').onclick = function(){ publishCmd('exit'); };

  // ===== 退出登录 =====
  document.getElementById('logoutBtn').onclick = function(){
    try{ client.end(true); }catch(e){}
    client = null; loggedIn = false;
    monitorView.classList.add('hidden');
    loginView.classList.remove('hidden');
    loginError.textContent = '';
    document.getElementById('loginPwd').value = '';
    loginBtn.disabled = false;
    logBox.innerHTML = '<div class="log-line log-info"><span class="t">--</span>等待日志推送...</div>';
  };

})();
</script>
</body>
</html>
